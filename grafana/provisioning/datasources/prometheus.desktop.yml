apiVersion: 1

# docker-compose.desktop.yml 专用：Grafana 在 bridge 网络里通过服务名访问 Prometheus。
datasources:
  - name: Prometheus
    uid: prom-prod
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
