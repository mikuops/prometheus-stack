# docker-compose.desktop.yml 专用：容器之间用服务名互访。
# 主机指标来自 Docker 的 Linux 虚拟机，探测目标也是栈内端点，仅用于看界面。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: prometheus-stack-desktop

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: http-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://prometheus:9090/-/ready']
        labels: { service: prometheus, env: desktop, team: demo, module: http_2xx }
      - targets: ['http://alertmanager:9093/-/healthy']
        labels: { service: alertmanager, env: desktop, team: demo, module: http_2xx }
      - targets: ['http://grafana:3000/api/health']
        labels: { service: grafana, env: desktop, team: demo, module: http_2xx }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
